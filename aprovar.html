<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Aprovar proposta | Global</title><style>
:root{font-family:Arial,sans-serif;color:#16243b;background:#f3f6fa}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header{background:#142640;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}header h1{margin:0;font-size:25px}header small{color:#d2dce9}main{max-width:1050px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #e1e7ef;border-radius:14px;padding:22px;margin-bottom:18px}h2{margin:0 0 18px;font-size:19px}label{font-size:13px;color:#40516b;display:block;margin-bottom:5px}input,textarea{width:100%;border:1px solid #bfcbd9;border-radius:8px;padding:10px;font:inherit}input:focus{outline:2px solid #d5e8ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:9px;align-items:end;margin:10px 0}.item button{height:40px}.actions{display:flex;gap:9px;flex-wrap:wrap}button{cursor:pointer;border:0;background:#17345b;color:white;padding:11px 15px;border-radius:8px;font-weight:600}button.secondary{background:#e9eef5;color:#17345b}button:disabled{opacity:.5;cursor:not-allowed}.summary{font-size:24px;font-weight:bold;text-align:right}.note{color:#64748b;font-size:13px}.status{padding:10px;border-radius:8px;background:#eef4fb;margin:12px 0}footer{text-align:center;color:#64748b;padding:22px}@media(max-width:700px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr}.item .description{grid-column:1/-1}}@media print{footer,.actions,.note,.remove,.status,.no-print{display:none!important}header{background:white;color:#16243b;padding:10px}header small{color:#40516b}body{background:white}main{margin:0;max-width:none}.panel{border:0;break-inside:avoid;padding:8px}input{border:0;padding:3px}}
table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}input[type=checkbox]{width:auto;margin-right:8px}.wrap{overflow-x:auto}</style></head><body><header><h1>Global | Proposta comercial</h1><small>Acessórios e Soluções Logísticas</small></header><main><p id="public-status" class="no-print" role="status">Carregando proposta…</p><section id="proposal" class="panel" hidden><h2 id="public-number"></h2><p id="public-customer"></p><p id="public-expiry" class="note"></p><div class="wrap"><table><thead><tr><th>Produto</th><th>Qtde.</th><th>Unitário</th><th>Total</th></tr></thead><tbody id="public-items"></tbody></table></div><p id="public-shipping"></p><p id="public-discount"></p><p id="public-total" class="summary"></p><h2>Condições comerciais</h2><p id="public-notes" style="white-space:pre-wrap"></p><button id="public-print" class="no-print secondary">Salvar PDF / Imprimir</button></section><section id="acceptance" class="panel no-print" hidden><h2>Confirmação de aprovação</h2><form id="accept-form"><div class="grid"><div><label for="approver-name">Nome completo do responsável</label><input id="approver-name" required minlength="2" maxlength="200" autocomplete="name"></div><div><label for="approver-email">E-mail do responsável</label><input id="approver-email" type="email" required maxlength="254" autocomplete="email"></div></div><p><label><input id="accept-terms" type="checkbox" required><span id="public-terms"></span></label></p><button id="accept-button" type="submit">Confirmar aprovação</button></form></section></main><footer>Global Acessórios e Soluções Logísticas</footer><script type="module" src="./js/approve.mjs?v=approval1"></script></body></html>
